# Veröffentlicht die Website auf GitHub Pages.
#
# Gebaut wird hier, nicht auf dem Rechner: die Leistungsseiten, die
# Abnahmefassung, sitemap.xml und robots.txt entstehen bei jedem Push neu
# aus inhalt/. Damit kann es nicht passieren, dass jemand inhalt/ ändert,
# das Bauen vergisst und eine alte Fassung online steht.
#
# Gebaut wird in _site/, nicht im Quellbaum — so bleibt sichtbar, was von
# Hand gepflegt wird und was erzeugt ist.
#
# WICHTIG: Damit dieser Ablauf greift, muss in den Einstellungen des
# Depots unter Settings → Pages → Build and deployment → Source
# „GitHub Actions“ gewählt sein. Sonst veröffentlicht Pages weiterhin den
# Zweig direkt und die erzeugten Seiten kommen nie an.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seiten erzeugen
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          cd _site
          # Unter kodozen.github.io/ckr/ liegt die Seite in einem
          # Unterordner. Nur die 404-Seite braucht das: sie wird für jede
          # unbekannte Adresse ausgeliefert und arbeitet deshalb als
          # einzige mit absoluten Verweisen. Beim Umzug auf die eigene
          # Domain hier auf "/" setzen.
          # BASIS steuert canonical, og:url, sitemap.xml und llms.txt.
          # Für die Vorschau muss das die Vorschauadresse sein; beim Umzug
          # auf die eigene Domain fällt die Zeile weg und der eingebaute
          # Vorgabewert (https://www.ckrreinigung.at) greift wieder.
          export BASIS=https://kodozen.github.io/ckr
          SEITEN_WURZEL=/ckr/ python3 tools/seiten-bauen.py
          python3 tools/uebersetzen.py tr
          python3 tools/sitemap-bauen.py

          # Die Startseite wird von Hand gepflegt; ihr canonical steht
          # deshalb fest im Text und muss hier nachgezogen werden — sonst
          # zeigt ausgerechnet die wichtigste Seite auf eine fremde Adresse.
          python3 - <<'PY'
          import os, pathlib
          basis = os.environ["BASIS"].rstrip("/")
          echt = "https://www.ckrreinigung.at"
          if basis != echt:
              n = 0
              for d in pathlib.Path(".").rglob("*.html"):
                  if any(t in d.parts for t in (".git", ".github")):
                      continue
                  t = d.read_text(encoding="utf-8")
                  if echt in t:
                      d.write_text(t.replace(echt, basis), encoding="utf-8")
                      n += 1
              print(f"canonical/og:url in {n} Dateien auf {basis} gezogen")
          PY

      - name: Prüfen, dass kein Verweis ins Leere zeigt
        run: |
          cd _site
          python3 - <<'PY'
          import os, re, sys, urllib.parse
          seiten = []
          for wurzel, ordner, dateien in os.walk("."):
              ordner[:] = [o for o in ordner if o not in {".git", "schrift", "video", "tools", "inhalt", "i18n", ".github"}]
              seiten += [os.path.join(wurzel, d) for d in dateien if d.endswith(".html")]
          kaputt = []
          for seite in sorted(seiten):
              s = open(seite, encoding="utf-8").read()
              basis = os.path.dirname(seite)
              for m in re.finditer(r'(?:href|src)="([^"]+)"', s):
                  ziel = m.group(1)
                  if re.match(r"^(https?:|mailto:|tel:|data:|#|/)", ziel):
                      continue
                  pfad = urllib.parse.urlparse(ziel).path
                  if not pfad:
                      continue
                  voll = os.path.normpath(os.path.join(basis, pfad))
                  if os.path.isdir(voll):
                      voll = os.path.join(voll, "index.html")
                  if not os.path.exists(voll):
                      kaputt.append("%s → %s" % (seite, ziel))
          if kaputt:
              print("Tote Verweise:")
              print("\n".join("  " + k for k in kaputt))
              sys.exit(1)
          print("%d Seiten geprüft, kein toter Verweis." % len(seiten))
          PY

      # ------------------------------------------------------------
      # Vorschau aus dem Suchindex halten
      # ------------------------------------------------------------
      # Solange die Seite unter kodozen.github.io/ckr/ liegt, greift
      # unsere robots.txt NICHT: Suchmaschinen lesen robots.txt nur an
      # der Wurzel einer Domain, und die gehört hier dem Konto, nicht
      # diesem Ordner. Ohne diesen Schritt landet die Vorschau im Index
      # und macht der echten Domain später Konkurrenz — mit demselben
      # Text, unter fremdem Namen.
      #
      # Beim Umzug auf ckrreinigung.at: VORSCHAU auf "nein" setzen.
      # Dann wird nichts eingefügt und robots.txt greift wieder, weil
      # die Seite dann an der Wurzel ihrer eigenen Domain liegt.
      # Solange der Kunde die beiden Entwürfe vergleicht, steht der
      # Schalter auf "nein", damit sich die Seite überhaupt messen lässt:
      # "Seite ist für die Indexierung gesperrt" zieht die Bewertung der
      # Suchmaschinentauglichkeit auf null. Fällt die Entscheidung gegen
      # diesen Entwurf, gehört er wieder auf "ja".
      - name: Vorschau auf noindex setzen
        env:
          VORSCHAU: "nein"
        run: |
          if [ "$VORSCHAU" != "ja" ]; then
            echo "Echte Domain — es wird nichts eingefügt."
            exit 0
          fi
          cd _site
          python3 - <<'PY'
          import os, re
          MARKE = '<meta name="robots" content="noindex, nofollow">'
          n = 0
          for wurzel, ordner, dateien in os.walk("."):
              ordner[:] = [o for o in ordner if o not in {".git", ".github"}]
              for d in dateien:
                  if not d.endswith(".html"):
                      continue
                  pfad = os.path.join(wurzel, d)
                  s = open(pfad, encoding="utf-8").read()
                  if "noindex" in s:
                      continue
                  s = s.replace("</head>",
                                "<!-- Vorschauadresse: nicht in den Suchindex. "
                                "Wird beim Umzug auf die echte Domain nicht mehr "
                                "eingefügt (siehe .github/workflows/pages.yml). -->\n"
                                + MARKE + "\n</head>", 1)
                  open(pfad, "w", encoding="utf-8").write(s)
                  n += 1
          print("%d Seiten auf noindex gesetzt." % n)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
